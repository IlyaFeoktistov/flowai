[build-system]
# hatchling, НЕ setuptools — setuptools' build_meta пытается выполнить
# корневой setup.py как часть сборки пакета (легаси-поведение), а он у нас —
# отдельный bootstrap-скрипт под опциональные ML-подсистемы (свой argparse,
# `--only`/`--dry-run`), не упаковщик. hatchling вообще не трогает setup.py.
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowai"
# Держать в синхроне с version.py:__version__ вручную — см. его докстринг.
version = "1.6.0"
description = "Python CLI AI chat application powered by Ollama"
license = "MIT"
requires-python = ">=3.12"
# Тот же список, что requirements.txt (используется и `setup.py`'s main-venv
# шагом, `pip install -r requirements.txt`, см. setup.py:143) — hatchling не
# умеет читать зависимости ИЗ файла нативно (в отличие от setuptools), так
# что список продублирован; при изменении requirements.txt поправить и тут.
dependencies = [
    "ollama>=0.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "crawl4ai>=0.3.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "distro>=1.9.0",
    "psutil>=7.0.0",
    "python-lsp-server>=1.14.0",
    "langchain>=1.3.11",
    "langchain-core>=1.4.8",
    "langgraph>=1.2.7",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.1.0",
    "mcp>=1.28.1",
    "pydantic>=2.13.4",
]

[project.scripts]
flowai = "cli:run"

[tool.pytest.ini_options]
# Без этого голый `pytest` из корня репозитория пытается собрать и
# vendor/llama-expert-streaming/tools/server/tests/ (сторонний форк
# llama.cpp, свои конфликтующие фикстуры/зависимости) — падает на
# коллекции, а не на самих тестах flowAI.
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
# Плоский layout, но физически под src/ (src/cli.py, src/mcp_agent/...), не
# src/flowai/... — sources ниже strip'ает "src/" при сборке колеса/editable-
# установки, так что в собранном пакете/на sys.path модули всё равно видны
# ПЛОСКО (top-level `cli`, `mcp_agent`, ...), как и раньше; поменялось только
# физическое расположение файлов на диске, не layout самого пакета. include
# ниже — пути ДО strip'а (реальные пути в репозитории), get_distribution_path
# сам вычисляет, во что каждый превратится.
#
# Список — "main" (см. README:"Установка"): то, что покрывает requirements.txt
# и обязательно для базового чата. Тяжёлые опциональные части (веса/расчёты
# image-gen/whisper/tts/gen3d-пайплайна, vendor/*) вне пакета — они ставятся
# отдельно через `python3 setup.py --only ...` в СВОИ изолированные venv
# (конфликтующие версии torch/CUDA между ними), не через `pip install .`.
#
# gen3d/*.py (БЕЗ blender_scripts/) — включены, хотя это папка "тяжёлого"
# 3D-пайплайна: cli.py импортирует tools.gen_model, тот — gen3d.pipeline и
# gen3d.animato_client напрямую при старте (не лениво), а сами эти конкретные
# файлы — только оркестрация/subprocess (httpx/ollama/stdlib), без torch —
# в отличие от hunyuan_wrapper.py/texture_wrapper.py/material_wrapper.py
# (те импортируют torch/diffusers/hy3dgen, но выполняются КАК ОТДЕЛЬНЫЕ
# скрипты внутри vendor/*/venv через subprocess, а не импортируются сюда).
# Живой баг, найденный на реальной non-editable установке в чистый venv:
# без gen3d/*.py `import cli` падал с ModuleNotFoundError уже на старте,
# даже без единого вызова /gen_model.
sources = ["src"]
include = [
    "src/cli.py", "src/compress.py", "src/main.py", "src/memory_admin.py",
    "src/model_lifecycle.py", "src/settings.py", "src/storage.py", "src/usage.py",
    "src/episodic/**", "src/mcp_agent/**", "src/memory/**", "src/rag/**", "src/tools/**",
    "src/ui/**", "src/utils/**", "src/gen3d/*.py",
]
